version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoapply-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000
      - JWT_SECRET=autoapply-jwt-production-grade-key-docker-min32bytes!
      - SECRET_KEY=autoapply-sec-production-grade-key-docker-min32bytes!
      - DRY_RUN=true
      - AUTO_SUBMIT_ENABLED=false
      - MATCH_THRESHOLD=0.35
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - autoapply-data:/app/app/data
      - autoapply-screenshots:/app/data/screenshots
      - autoapply-resumes:/app/data/resumes
      - ./frontend:/frontend:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: autoapply-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autoapply-data:
    driver: local
  autoapply-screenshots:
    driver: local
  autoapply-resumes:
    driver: local
