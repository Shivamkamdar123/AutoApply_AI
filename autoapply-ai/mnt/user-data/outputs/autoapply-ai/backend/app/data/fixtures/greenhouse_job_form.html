<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Application Mock</title>
</head>
<body>
  <div id="application">
    <h2>Apply for this Job</h2>
    <form id="application_form">
      <div class="field">
        <label for="first_name">First Name <span class="asterisk">*</span></label>
        <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="last_name">Last Name <span class="asterisk">*</span></label>
        <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name">
      </div>
      <div class="field">
        <label for="email">Email <span class="asterisk">*</span></label>
        <input type="email" id="email" name="job_application[email]" autocomplete="email">
      </div>
      <div class="field">
        <label for="phone">Phone <span class="asterisk">*</span></label>
        <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel">
      </div>
      <div class="field">
        <label for="urls[LinkedIn]">LinkedIn Profile</label>
        <input type="text" id="urls[LinkedIn]" name="job_application[answers_attributes][0][text_value]">
      </div>
      <div class="submit-wrapper">
        <input type="button" id="submit_app" value="Submit Application">
      </div>
    </form>
    <div id="application_confirmation" style="display:none;">Application Submitted!</div>
  </div>
</body>
</html>
